<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Godot Centralized Log Viewer</title>
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon" />
    <link rel="stylesheet" href="css/index.css" />
    <script type="module" src="js/index.js"></script>
  </head>

  <body>
    <main>
      <header>
        <div>
          <span
            id="statusDot"
            role="status"
            data-status="online"
            aria-label="System status: online"
          ></span>
          <h1>Godot Log Viewer</h1>
        </div>

        <dl aria-label="Log counts summary">
          <div data-severity="error">
            <dt><span class="dot" aria-hidden="true"></span>Error</dt>
            <dd id="countError">0</dd>
          </div>
          <div data-severity="warning">
            <dt><span class="dot" aria-hidden="true"></span>Warning</dt>
            <dd id="countWarn">0</dd>
          </div>
          <div data-severity="info">
            <dt><span class="dot" aria-hidden="true"></span>Info</dt>
            <dd id="countInfo">0</dd>
          </div>
        </dl>
      </header>

      <div class="control-sections">
        <section aria-label="Search and filter">
          <search>
            <label for="searchInput" class="sr-only"
              >Search logs or scripts</label
            >
            <input
              type="search"
              id="searchInput"
              placeholder="Search log messages or .gd paths..."
            />
          </search>

          <ul aria-label="Filter by severity">
            <li>
              <button type="button" data-filter="ALL" aria-pressed="true">
                All
              </button>
            </li>
            <li>
              <button type="button" data-filter="ERROR" aria-pressed="false">
                Error
              </button>
            </li>
            <li>
              <button type="button" data-filter="WARNING" aria-pressed="false">
                Warn
              </button>
            </li>
            <li>
              <button type="button" data-filter="INFO" aria-pressed="false">
                Info
              </button>
            </li>
          </ul>
        </section>

        <section aria-label="Audio notification settings">
          <label>
            <input type="checkbox" id="audioToggle" />
            Alert Sound
          </label>

          <label for="audioKeyword" class="sr-only">Trigger keyword</label>
          <input
            type="text"
            id="audioKeyword"
            placeholder="Keyword (e.g. asset)"
            disabled
          />

          <button type="button" id="btnSetAudio" disabled>Set</button>
        </section>

        <section aria-label="Log actions">
          <ul>
            <li><button type="button" id="btnExport">Export CSV</button></li>
            <li><button type="button" id="btnClear">Clear All</button></li>
          </ul>
        </section>
      </div>

      <section aria-label="Log Output">
        <details class="column-visibility-menu">
          <summary class="btn">Columns</summary>
          <ul role="group" aria-label="Toggle table columns">
            <li>
              <label
                ><input type="checkbox" data-column="id" checked /> ID</label
              >
            </li>
            <li>
              <label
                ><input type="checkbox" data-column="time" checked />
                Time</label
              >
            </li>
            <li>
              <label
                ><input type="checkbox" data-column="type" checked />
                Type</label
              >
            </li>
            <li>
              <label
                ><input type="checkbox" data-column="script-path" checked />
                Script Path</label
              >
            </li>
            <li>
              <label
                ><input type="checkbox" data-column="message" checked />
                Message</label
              >
            </li>
          </ul>
        </details>

        <table>
          <caption>
            Centralized System Logs
          </caption>
          <thead>
            <tr>
              <th scope="col">
                <input
                  type="checkbox"
                  id="selectAllRows"
                  aria-label="Select all rows"
                />
              </th>
              <th scope="col">ID</th>
              <th scope="col">Time</th>
              <th scope="col">Type</th>
              <th scope="col">Script Path</th>
              <th scope="col">Message</th>
              <th scope="col">Action</th>
            </tr>
          </thead>
          <tbody id="logTableBody"></tbody>
        </table>
      </section>
    </main>
  </body>
</html>
